<div class="full-page-wrapper">
    <header class="page-header">
        <div>
            <button class="back" (click)="goDashboard()">
                <mat-icon>arrow_back</mat-icon>
            </button>
            Alert Logs
        </div>
        <app-colorpicker></app-colorpicker>
    </header>
    <div class="alert-content">
        <div class="controls-container">
            <mat-form-field appearance="outline" class="search-input">
                <mat-label>Search logs...</mat-label>
                <input matInput (keyup)="applySearchFilter($event)" placeholder="E.g., Camera 1, Unusual activity">
                <mat-icon matPrefix>search</mat-icon>
            </mat-form-field>
        </div>
        
        <mat-card class="table-card">
            <div class="mat-elevation-z2">
                <table mat-table [dataSource]="dataSource" matSort> 
        
                    <ng-container matColumnDef="camera">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by camera name"> Name of Camera </th>
                        <td mat-cell *matCellDef="let element"> {{element.camera}} </td>
                    </ng-container>
        
                    <ng-container matColumnDef="type">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by type"> Type </th>
                        <td mat-cell *matCellDef="let element"> {{element.type}} </td>
                    </ng-container>
        
                    <ng-container matColumnDef="location">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by location"> Location </th>
                        <td mat-cell *matCellDef="let element"> {{element.location}} </td>
                    </ng-container>
        
                    <ng-container matColumnDef="time">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by time"> Time </th>
                        <td mat-cell *matCellDef="let element"> {{element.time | date:'yyyy-MM-dd HH:mm:ss'}} </td>
                    </ng-container>
        
                    <ng-container matColumnDef="alertLevel">
                        <th mat-header-cell *matHeaderCellDef mat-sort-header sortActionDescription="Sort by alert level"> Alert Level </th>
                        <td mat-cell *matCellDef="let element"> 
                            <span [class]="'alert-level-' + element.alertLevel.toLowerCase()">
                                {{element.alertLevel}}
                            </span>
                        </td>
                    </ng-container>
        
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        
                    <tr class="mat-row no-data-row" *matNoDataRow>
                        <td class="mat-cell" colspan="5">No logs matching the filter/search criteria.</td>
                    </tr>
                </table>
            </div>
            
            <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
        </mat-card>
    </div>
</div>
