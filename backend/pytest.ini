[pytest]
# Mark tests as asyncio tests by default
asyncio_mode = auto

# Directories to search for tests
testpaths = tests

# Test file naming pattern
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show extra test summary info
addopts = 
    --cov=core
    --cov=entities
    --cov=utils
    --cov-report=term-missing
    -v

# Do not recurse into these directories
norecursedirs = .* build dist venv env __pycache__ alembic

# Log level for the test run
log_cli = true
log_cli_level = INFO

# Cache directories for faster test runs
cache_dir = .pytest_cache
