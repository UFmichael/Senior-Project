services: 
  postgres:
    image: postgres:17.4
    restart: always
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seniorprojectdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  rtmp-hls:
    image: alqutami/rtmp-hls
    container_name: rtmp-hls
    ports:
      - "1935:1935"
      - "1936:1936"
      - "1937:1937"

volumes:
  pgdata: